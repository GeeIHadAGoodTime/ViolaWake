# Compose override: bridge ViolaWake Console backend to Viola's internal
# Docker network so viola-cloud can call /api/recordings/* and /api/jobs/*
# without going through Cloudflare.
#
# Usage:
#   docker compose -f docker-compose.production.yml -f docker-compose.viola-bridge.yml up -d
#
# This file is INTENTIONALLY separate from docker-compose.production.yml so
# the Wakeword product can still ship standalone (no Viola dependency).
#
# STATUS as of #2305 (2026-07-22): both things this override used to supply
# uniquely -- the `wakeword-backend` network alias and the pinned
# VIOLAWAKE_DB_URL -- are now baked directly into docker-compose.production.yml
# (see that file's backend-service `networks:` block and its
# `VIOLAWAKE_DB_URL` environment line). That was the fix for a recurring
# base-only-deploy-drops-out-of-band-wiring bug class (#1722's Postgres-host
# outage, then #2305's dropped wakeword-backend alias): a routine deploy
# running ONLY the documented `docker compose -f docker-compose.production.yml
# up -d backend` (docs/DEPLOYMENT.md) used to silently drop whatever only this
# overlay supplied. This file is now a REDUNDANT no-op overlay -- its alias
# and env value duplicate what the base file already sets -- kept so
# `-f docker-compose.viola-bridge.yml` stays a harmless, backward-compatible
# no-op in any deploy command that still passes it, not because it is still
# load-bearing. Add a NEW override here only for a genuinely Viola-only
# concern that shouldn't ship in the standalone base file.
#
# Why pin VIOLAWAKE_DB_URL to wakeword-postgres-1 (now also in base):
#   When `backend` joins both `default` (wakeword's network) and
#   `novviola_viola-local` (Viola's network), Docker's embedded DNS resolves
#   the unqualified hostname `postgres` against ALL attached networks. Viola
#   has its own `viola-postgres-local` container aliased as `postgres` on its
#   network — without pinning, asyncpg can hit Viola's postgres and 401 with
#   InvalidPasswordError. Pinning to `wakeword-postgres-1` (the compose-
#   generated container name, unique across networks) breaks the tie.
#
# Verified live 2026-05-13: with this override + matching VIOLA_WAKEWORD_*
# env in Viola, viola-api reaches `http://wakeword-backend:8000` and the
# Console authenticates Viola via VIOLAWAKE_SERVICE_KEY.

services:
  backend:
    networks:
      default: {}
      decoder-net: {}
      novviola_viola-local:
        aliases:
          - wakeword-backend
    environment:
      # Override the default `postgres` hostname so multi-network DNS
      # resolution can't accidentally route DB connections to Viola's
      # postgres. See header comment.
      - VIOLAWAKE_DB_URL=postgresql+asyncpg://violawake:${POSTGRES_PASSWORD}@wakeword-postgres-1:5432/violawake

networks:
  novviola_viola-local:
    external: true

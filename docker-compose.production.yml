services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: violawake
      POSTGRES_USER: violawake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U violawake"]
      interval: 5s
      timeout: 3s
      retries: 5
    shm_size: 256mb

  backend:
    build:
      context: .
      dockerfile: console/Dockerfile.backend
      # Which commit this image was built from. scripts/deploy_backend.py sets
      # VIOLAWAKE_BUILD_SHA and then reads this label back off the RUNNING
      # container to answer "what is actually serving?" -- a question the tag
      # `:latest` cannot answer, and the question behind every "is that fix
      # live?" ambiguity this stack has had. A hand-run `docker compose build`
      # with the variable unset simply labels the image `unknown`, which the
      # deploy script treats as "not verifiable", never as "up to date".
      labels:
        org.opencontainers.image.revision: ${VIOLAWAKE_BUILD_SHA:-unknown}
        org.opencontainers.image.source: https://github.com/GeeIHadAGoodTime/ViolaWake
    # GHCR mirror of the locally-built image so a fresh host can
    # `docker compose pull backend` instead of rebuilding from source.
    # On the build host, `docker compose build` produces this same name.
    image: ghcr.io/geeihadagoodtime/wakeword-backend:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /app/data/tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # Permanent backend cap after fixing all-at-once negative corpus loading.
    # Live proof on 2026-05-14 completed a full TemporalCNN training job with
    # peak container memory at ~0.794 GiB and zero restarts. Keep concurrency
    # at 1 and leave ~1 GiB of headroom above the measured peak.
    mem_limit: 2g
    pids_limit: 200
    expose:
      - "8000"
    volumes:
      - backend-data:/app/data
      - openwakeword-models:/usr/local/lib/python3.11/site-packages/openwakeword/resources/models
      - ${VIOLAWAKE_NEGATIVES_CORPUS_DIR:-./violawake_data/negatives}:/app/negatives:ro
      # REQUIRED — universal corpus (LibriSpeech + MUSAN) for training-time
      # speech negatives. See docs/DEPLOYMENT.md. If ./corpus is unavailable,
      # run violawake-download-corpus and mount ~/.violawake/corpus here instead.
      - ./corpus:/app/corpus:ro
    env_file:
      - .env.production
    environment:
      - VIOLAWAKE_DB_URL=postgresql+asyncpg://violawake:${POSTGRES_PASSWORD}@wakeword-postgres-1:5432/violawake
      - VIOLAWAKE_NEGATIVES_CORPUS_DIR=/app/negatives
      - VIOLAWAKE_USE_DECODER_SIDECAR=${VIOLAWAKE_USE_DECODER_SIDECAR:-0}
      - VIOLAWAKE_DECODER_SIDECAR_URL=http://decoder:8001/decode
      - HOME=/app/data/home
      - XDG_CACHE_HOME=/app/data/cache
      - MPLCONFIGDIR=/tmp/matplotlib
    depends_on:
      postgres:
        condition: service_healthy
      decoder:
        condition: service_healthy
    networks:
      default: {}
      decoder-net: {}
      # Reach the shared self-hosted GlitchTip instance (VIOLAWAKE_SENTRY_DSN
      # points at http://glitchtip-web:8080, a NOVVIOLA-stack container) AND
      # answer as `wakeword-backend` for viola-api's
      # VIOLA_WAKEWORD_API_URL=http://wakeword-backend:8000.
      # Incident (2026-07-14, GlitchTip leg): the network attach was
      # previously an undocumented one-off `docker network connect`, which
      # does NOT survive a normal `docker compose up -d backend` recreate
      # (the documented deploy step in docs/DEPLOYMENT.md) -- so a routine
      # backend deploy silently dropped GlitchTip connectivity, and error
      # reporting failed closed with no visible symptom (container stayed
      # healthy; only Sentry sends failed, buried in logs as urllib3
      # NameResolutionError retries).
      #
      # Incident (2026-07-17, wakeword-backend alias leg, #2305): the same
      # base-only-deploy-drops-out-of-band-wiring class recurred for the
      # `wakeword-backend` alias itself. It used to live ONLY in the
      # separate docker-compose.viola-bridge.yml overlay (see that file's
      # header) -- so any deploy following docs/DEPLOYMENT.md's documented
      # `docker compose -f docker-compose.production.yml up -d backend`
      # (base file only, no bridge overlay) silently dropped it, leaving
      # viola-api unable to resolve wakeword-backend while /health stayed
      # green (the same shape as #1722's Postgres-host outage -- twice-
      # recurred). Baking the alias into THIS base file, where the network
      # is already attached for GlitchTip, makes a base-only deploy safe by
      # construction instead of depending on remembering the second -f flag.
      novviola_viola-local:
        aliases:
          - wakeword-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  decoder:
    build:
      context: .
      dockerfile: console/decoder/Dockerfile
    # GHCR mirror — see backend note above.
    image: ghcr.io/geeihadagoodtime/wakeword-decoder:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    expose:
      - "8001"
    volumes:
      - decoder-work:/work
    networks:
      - decoder-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: console/Dockerfile.frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # RETIRED 2026-07-09: this connector served Cloudflare tunnel 7dbef1da, which
  # was an orphaned tunnel with NO DNS routing to it (api.violawake.com is served
  # by the separate violawake-api-server tunnel a4961724). The tunnel was deleted
  # as part of the #326 Cloudflare estate cleanup. Left commented (not removed) so
  # the retirement is discoverable; re-enable only against a live, DNS-routed tunnel.
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   restart: always
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     backend:
  #       condition: service_healthy

volumes:
  pgdata:
  backend-data:
  openwakeword-models:
  decoder-work:

networks:
  default:
  decoder-net:
    internal: true
  # Shared cross-stack network (created by the NOVVIOLA cloud compose stack)
  # that hosts glitchtip-web. Must already exist on the host; see the backend
  # service's networks: comment above for why this is declared explicitly.
  novviola_viola-local:
    external: true

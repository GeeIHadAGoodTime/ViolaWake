repos:
  - repo: local
    hooks:
      - id: check-claudemd-approval
        name: CLAUDE.md edits require explicit Jay-approved trailer + companion file
        # Why: an unauthorized CLAUDE.md edit propagates to every future Claude
        # session's context indefinitely; one bad sentence becomes systemic agent
        # guidance until caught. Revert flow: CLAUDEMD-Revert: <sha>.
        entry: python scripts/check_claudemd_approval.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

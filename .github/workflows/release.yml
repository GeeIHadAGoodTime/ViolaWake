name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # for GitHub Release creation
  id-token: write  # for PyPI trusted publishing (OIDC)

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Validate the release
  # ──────────────────────────────────────────────
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.extract-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract-version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${TAG}"

      - name: Verify version matches pyproject.toml
        run: |
          PYPROJECT_VERSION=$(python -c "
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          TAG_VERSION="${{ steps.extract-version.outputs.version }}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: pyproject.toml version ($PYPROJECT_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio
        run: sudo apt-get install -y portaudio19-dev

      - name: Install and run full test suite
        run: |
          pip install -e ".[dev]"
          pytest tests/unit/ -v --cov=violawake_sdk --cov-fail-under=65

  # ──────────────────────────────────────────────
  # Job 2: Build distribution artifacts
  # ──────────────────────────────────────────────
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-22.04
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hatch
        run: pip install hatch

      - name: Build wheel and sdist
        run: hatch build

      - name: Verify wheel contents
        run: |
          pip install twine
          twine check dist/*

      - name: Smoke test built wheel
        run: |
          python -m venv .wheel-smoke
          . .wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib
          import importlib.metadata as metadata

          import violawake
          import violawake_sdk
          from violawake_sdk import *  # noqa: F401,F403
          from violawake_sdk.models import ModelCache

          required_modules = [
              "violawake_sdk.tools.download_model",
              "violawake_sdk.tools.evaluate",
              "violawake_sdk.tools.train",
              "violawake_sdk.tools.collect_samples",
              "violawake_sdk.tools.download_corpus",
              "violawake_sdk.tools.expand_corpus",
              "violawake_sdk.tools.streaming_eval",
              "violawake_sdk.tools.test_confusables",
              "violawake_sdk.tools.contamination_check",
              "violawake_sdk.tools.generate_samples",
          ]
          for module_name in required_modules:
              importlib.import_module(module_name)

          scripts = {
              ep.name: ep.value
              for ep in metadata.entry_points(group="console_scripts")
              if ep.name.startswith("violawake-")
          }
          missing_scripts = {
              "violawake-train",
              "violawake-eval",
              "violawake-collect",
              "violawake-download",
              "violawake-download-corpus",
              "violawake-expand-corpus",
              "violawake-streaming-eval",
              "violawake-test-confusables",
              "violawake-contamination-check",
              "violawake-generate",
          } - set(scripts)
          if missing_scripts:
              raise SystemExit(f"missing console scripts: {sorted(missing_scripts)}")
          if violawake.__version__ != violawake_sdk.__version__:
              raise SystemExit("violawake shim version does not match violawake_sdk")
          if not callable(ModelCache):
              raise SystemExit("ModelCache is not importable")
          print(f"wheel smoke ok: violawake {violawake_sdk.__version__}")
          PY
          violawake-download --help >/tmp/violawake-download-help.txt

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  # ──────────────────────────────────────────────
  # Job 3: Create GitHub Release with model assets
  # ──────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [validate, build]

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Fetch model files from model artifact store
        # Tolerant of "no models for this version yet" — `gh release download`
        # has a chicken-and-egg problem when the release is being created in
        # this same workflow. The SDK auto-downloads the OWW backbone at
        # runtime, so PyPI users do not depend on Release assets being
        # attached. `continue-on-error: true` keeps the release moving on a
        # 404 from gh / urllib fallback.
        continue-on-error: true
        env:
          MODEL_STORE_TOKEN: ${{ secrets.MODEL_STORE_TOKEN }}
        run: |
          mkdir -p models/
          python tools/fetch_release_models.py \
            --version ${{ needs.validate.outputs.version }} \
            --output models/ || echo "no model assets fetched — continuing"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ViolaWake SDK ${{ needs.validate.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, 'rc') || contains(needs.validate.outputs.version, 'alpha') || contains(needs.validate.outputs.version, 'beta') }}
          fail_on_unmatched_files: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            models/*.onnx

  # ──────────────────────────────────────────────
  # Job 4: Publish to PyPI (trusted publishing via OIDC)
  # ──────────────────────────────────────────────
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-22.04
    # Decoupled from github-release on purpose: PyPI publish is the
    # user-facing load-bearing step (`pip install violawake`). If the
    # GitHub Release creation fails — for example because no model
    # artifacts are attachable for a brand-new version — PyPI must still
    # publish. v0.2.3 was lost because this job had a transitive `needs`
    # on github-release, which 404'd on the model-fetch step.
    needs: [validate, build]
    environment: pypi  # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no API token needed if configured
        # in PyPI project settings. See:
        # https://docs.pypi.org/trusted-publishers/

  # ──────────────────────────────────────────────
  # Job 5: Update model registry SHA-256s in docs
  # ──────────────────────────────────────────────
  update-docs:
    name: Update model registry
    runs-on: ubuntu-22.04
    needs: [validate, github-release]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update model SHA-256s in models.py
        run: |
          python tools/update_model_registry.py \
            --version ${{ needs.validate.outputs.version }}

      - name: Commit updated registry
        run: |
          git config user.name "ViolaWake Release Bot"
          git config user.email "bot@violawake.dev"
          git add src/violawake_sdk/models.py
          git commit -m "chore: update model registry for v${{ needs.validate.outputs.version }}" || echo "No changes to commit"
          git push origin HEAD:master

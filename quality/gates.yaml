  - gate_id: backend-deploy-automation
    contract: A commit merged to master must reach the running api.violawake.com backend without a human SSH session, and must do it safely. The reconciler builds the target commit, labels the image with it, import-preflights the image, recreates the container, then proves the RUNNING image carries the target revision before calling it deployed. It defers rather than killing an in-flight training job, refuses a destructive alembic revision, refuses to build under the host disk floor, never force-moves a dirty or diverged deploy checkout, rolls back to the previously running image on any failed verification, and pages when undeployed drift outlives the staleness window. Proven against master 3697759 - the box was serving 577a5f7 with a merged customer-facing billing fix still undeployed two hours after it landed, and no workflow in the repo built or shipped a backend image at all.

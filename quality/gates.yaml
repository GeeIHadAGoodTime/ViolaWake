# Quality Gate Registry
#
# Schema:
# gates:
#   - gate_id: <kebab-case-id>
#     contract: <one sentence describing the regression shape this gate catches>
#     detector: <path to the detector script>
#     own_tests:
#       - <path to a test that proves the detector catches the broken shape>
#       - <path to a test that proves the detector stays quiet on the fixed shape>
#
# Populated by the 2026-06-03 audit integration commit from per-lane planned
# gate specs rolled up in _diag/2026-06-03/INTEGRATION_PLAN.md.

gates:
  - gate_id: audio-source-contract-strict
    contract: SDK audio sources fail closed on non-16kHz mono 16-bit 320-sample-frame input.
    detector: tests/unit/test_audio_source.py
    own_tests:
      - tests/unit/test_audio_source.py::TestFileSource::test_rejects_wrong_wav_sample_rate
      - tests/unit/test_audio_source.py::TestMicrophoneSourceContract

  - gate_id: oww-backbone-integrity-fail-closed
    contract: The installed OWW backbone hash must match the pinned registry hash before inference sessions load.
    detector: tests/unit/test_oww_backbone.py
    own_tests:
      - tests/unit/test_oww_backbone.py::TestBackboneIntegrity::test_integrity_mismatch_raises
      - tests/unit/test_oww_backbone.py::TestBackboneIntegrity::test_integrity_match_passes

  - gate_id: wake-detector-oracle-probes
    contract: Lane 1 oracle locks threshold 0.80, SDK audio constants, 96-dim OWW embeddings, and all four policy gates.
    detector: tests/unit/test_wake_detector_oracle.py
    own_tests:
      - tests/unit/test_wake_detector_oracle.py::test_default_threshold_is_080_and_rejects_050_score
      - tests/unit/test_wake_detector_oracle.py::test_detect_exercises_all_four_policy_gates_end_to_end

  - gate_id: wake-detector-per-category-far-bars
    contract: Benchmark v2 negative categories must stay at or below documented default-threshold false-accept bars.
    detector: tests/unit/test_wake_detector_oracle.py
    own_tests:
      - tests/unit/test_wake_detector_oracle.py::test_benchmark_v2_negative_categories_stay_under_documented_bars
      - tests/unit/test_wake_detector_oracle.py::test_default_threshold_is_080_and_rejects_050_score

  - gate_id: voice-pipeline-error-surfacing
    contract: VoicePipeline must surface no-op STT, TTS misconfiguration, and always-on VAD probe failures instead of silently returning to idle or deadlocking.
    detector: tests/unit/test_voice_pipeline_oracle_probes.py
    own_tests:
      - tests/unit/test_voice_pipeline_oracle_probes.py::test_noop_stt_empty_text_is_a_pipeline_error
      - tests/unit/test_voice_pipeline_oracle_probes.py::test_tts_wrong_voice_is_a_pipeline_error_from_command_path
      - tests/unit/test_voice_pipeline_oracle_probes.py::test_vad_always_on_stops_recording_at_max_duration

  - gate_id: stt-import-cause
    contract: STTEngine must distinguish a missing faster-whisper package from installed-but-broken transitive imports.
    detector: tests/unit/test_stt_tts_engines.py
    own_tests:
      - tests/unit/test_stt_tts_engines.py::TestSTTEngineErrorHandling::test_import_error_when_faster_whisper_missing
      - tests/unit/test_stt_tts_engines.py::TestSTTEngineErrorHandling::test_import_error_preserves_transitive_dependency_failure

  - gate_id: wasm-python-score-parity
    contract: Built WASM and Python SDK must score the same 10 shared 16k mono 20ms-frame samples within score-space L_inf tolerance, and must catch wrong frame stride plus wrong classifier model probes.
    detector: wasm/scripts/wasm_parity_audit.py
    own_tests:
      - wasm/scripts/wasm_parity_audit.py
      - wasm/scripts/wasm_parity_audit.py --corpus-dir <real-10-sample-corpus>

  - gate_id: wasm-live-demo-model-load
    contract: The deployed WASM demo must reach listening state, request all three ONNX models, and emit no browser console or request failures.
    detector: wasm/scripts/live_wasm_smoke.py
    own_tests:
      - wasm/scripts/live_wasm_smoke.py
      - wasm/scripts/live_wasm_smoke.py --url http://127.0.0.1:8765/wasm/demo/ --origin http://127.0.0.1:8765

  - gate_id: training-audio-contract
    contract: Detects training pipeline acceptance of non-16 kHz or non-mono audio before embedding extraction.
    detector: tests/unit/test_train.py
    own_tests:
      - tests/unit/test_train.py::TestTrainHelpers::test_load_training_audio_rejects_wrong_sample_rate
      - tests/unit/test_train.py::TestTrainHelpers::test_extract_temporal_embeddings_rejects_wrong_sample_rate_before_embedding
      - tests/unit/test_train.py::TestTrainHelpers::test_load_training_audio_accepts_16khz_mono

  - gate_id: public-accuracy-claim-reproducer
    contract: Public benchmark claims must reproduce from pinned score artifacts, match the registered model SHA, and fail on label/category mismatches.
    detector: benchmark_v2/reproduce_claims.py
    own_tests:
      - tests/unit/test_benchmark_reproduce_claims.py::test_validate_model_metadata_rejects_wrong_sha
      - tests/unit/test_benchmark_reproduce_claims.py::test_score_validation_rejects_positive_row_under_negative_path
      - tests/unit/test_benchmark_reproduce_claims.py::test_reproducer_current_artifacts_pass

  - gate_id: installed-project-scripts-smoke
    contract: Every published pyproject console script remains installed and its help path exits 0 after editable install.
    detector: tests/unit/test_cli.py
    own_tests:
      - tests/unit/test_cli.py::TestInstalledProjectScripts::test_distribution_metadata_exposes_all_published_cli_scripts
      - tests/unit/test_cli.py::TestInstalledProjectScripts::test_installed_script_help_exits_zero

  - gate_id: release-wheel-public-surface-smoke
    contract: Built wheels must expose the documented top-level imports, compatibility shim, ModelCache, tools modules, and console scripts before PyPI publish.
    detector: .github/workflows/release.yml
    own_tests:
      - tests/integration/test_sdk_surface.py
      - tests/unit/test_models.py

  - gate_id: all-modelspec-live-url-sha
    contract: Every ModelSpec in MODEL_REGISTRY must have a live HTTPS artifact URL whose downloaded bytes match the pinned SHA-256.
    detector: scripts/verify_models.py
    own_tests:
      - _diag/2026-06-03/model-verify-all-report.json

  - gate_id: live-backend-oracle-contract
    contract: Live backend proof scripts must use backend/OpenAPI-backed routes and request field names.
    detector: tests/live/test_live_oracle_contract.py
    own_tests:
      - tests/live/test_live_oracle_contract.py::test_live_billing_oracle_uses_documented_checkout_route
      - tests/live/test_live_oracle_contract.py::test_full_pipeline_download_token_uses_resource_id

  - gate_id: frontend-api-url-baked
    contract: Production frontend JS bundles must contain https://api.violawake.com/api, and an absent VITE_API_URL build must be detected by the same-origin "/api" fallback.
    detector: _diag/2026-06-03/lane9_bundle_api_probe.py
    own_tests:
      - _diag/2026-06-03/lane9_bundle_api_probe.py

  - gate_id: frontend-spa-route-render
    contract: Auth and console routes must preserve their requested route and render expected SPA selectors instead of falling through to the marketing homepage.
    detector: _diag/2026-06-03/lane9_live_probe.py
    own_tests:
      - _diag/2026-06-03/lane9_live_probe.py

  - gate_id: backup-restore-drill-freshness
    contract: Latest R2 Postgres backup must be fresh and restorable into scratch Postgres without writing production containers.
    detector: scripts/backup_restore_drill.py
    own_tests:
      - scripts/backup_restore_drill.py --inspect-only

  - gate_id: lane11-public-copy-claims
    contract: Public copy must not contain unsupported self-certification, legal-review, or fixed-latency benchmark claims.
    detector: scripts/generate_docs.py
    own_tests:
      - scripts/generate_docs.py --check-public-copy

  - gate_id: lane11-api-public-surface-docs
    contract: Generated public API docs must include every exported SDK public symbol.
    detector: scripts/generate_docs.py
    own_tests:
      - scripts/generate_docs.py --check-api-public-surface

  - gate_id: lane11-docs-registry-coverage
    contract: Living docs, ADRs, and contract-authoritative docs must be represented in docs/REGISTRY.md.
    detector: docs/REGISTRY.md
    own_tests:
      - docs/REGISTRY.md

  - gate_id: verification-email-server-side-link
    contract: Email verification must succeed on link click via a server-side backend GET endpoint, not depend on the client-rendered SPA route that a CDN redirect can strip.
    detector: console/tests/test_auth_email_routes.py
    own_tests:
      - console/tests/test_auth_email_routes.py::test_verification_email_links_to_backend_get_endpoint
      - console/tests/test_auth_email_routes.py::test_get_verify_email_link_marks_verified_and_redirects

  - gate_id: resend-verification-endpoint
    contract: A rate-limited POST /api/auth/resend-verification must exist so a user whose 48h verification token expired can get a fresh link. It must be privacy-preserving (identical generic response for unverified, already-verified, and unknown emails) and only send for an existing unverified account. Closes the 2026-07-06 support-ticket class where an expired token left the user with no self-service recovery.
    detector: console/tests/test_auth_email_routes.py
    own_tests:
      - console/tests/test_auth_email_routes.py::test_resend_verification_sends_new_link_for_unverified_account
      - console/tests/test_auth_email_routes.py::test_resend_verification_is_silent_for_verified_and_unknown_emails

  - gate_id: resend-verification-frontend-button
    contract: "The console's unverified-email banner must expose a working \"Resend verification email\" control that calls the resend-verification-endpoint backend, not static text. Closes GH #2153, where the backend endpoint shipped in PR #3 with no frontend caller, leaving users with lost verification emails no self-service recovery."
    detector: scripts/check_resend_verification_frontend_button.py
    own_tests:
      - scripts/check_resend_verification_frontend_button.py

  - gate_id: spa-deep-link-rewrite-target
    contract: SPA-fallback rewrite targets in the Pages _redirects must be canonical directory paths; a ".html" target gets 308-canonicalized by Cloudflare Pages, stripping the deep-link path (the 2026-05-08 verify-email/reset-password breakage class).
    detector: tests/unit/test_spa_rewrite_target.py
    own_tests:
      - tests/unit/test_spa_rewrite_target.py::test_detector_fails_on_the_pre_fix_shapes
      - tests/unit/test_spa_rewrite_target.py::test_detector_passes_on_the_fixed_and_benign_shapes

  - gate_id: sdist-no-secrets-or-debris
    contract: The built sdist must contain no secret-shaped content (Stripe sk_live/whsec, Postgres URL creds, Cloudflare tunnel token, private keys, cloud API keys) and no credential/agent-debris file names (.codex*, .env* except *.example, secrets.json, *.pem). Catches the 2026-05-08 violawake 0.2.4 leak class where unignored codex transcripts shipped a live Stripe key.
    detector: tests/unit/test_sdist_hygiene.py
    own_tests:
      - tests/unit/test_sdist_hygiene.py::test_release_sdist_contains_no_secrets_or_debris
      - tests/unit/test_sdist_hygiene.py::test_scanner_flags_codex_log_debris_by_name
      - tests/unit/test_sdist_hygiene.py::test_scanner_flags_live_stripe_key_in_innocuous_file
      - tests/unit/test_sdist_hygiene.py::test_scanner_flags_env_backup_and_postgres_and_tunnel
      - tests/unit/test_sdist_hygiene.py::test_scanner_stays_quiet_on_clean_tree

  - gate_id: console-quality-gate-block-is-expected-not-bug
    contract: A grade-F model quality-gate block (ONNX export blocked for weak/insufficient user recordings) is an EXPECTED training outcome and must be classified expected/WARNING (below the Sentry LoggingIntegration ERROR event_level), never an unexpected "bug"/ERROR that pages ops via GlitchTip (violawake issue 28, 2026-07-12). Classification keys off the ModelQualityGateError type, never the message text.
    detector: console/backend/tests/test_monitoring_quality_gate_classification.py
    own_tests:
      - console/backend/tests/test_monitoring_quality_gate_classification.py::test_quality_gate_error_is_expected_and_below_sentry_level
      - console/backend/tests/test_monitoring_quality_gate_classification.py::test_bare_runtimeerror_grade_f_message_is_still_the_old_bug_shape

  - gate_id: sdk-silence-subgrade-derived-from-deploy-threshold
    contract: "The training quality gate's silence subgrade C->F cliff MUST be DERIVED from the deployment threshold (DEFAULT_THRESHOLD / _run_quality_gate deployment_threshold), never a hardcoded constant disconnected from it. A near-silence max score below the deployment threshold cannot false-fire at deployment, so it must not force grade F; only silence at/above the deployment threshold fails, and the A/B tiers are fractions of the same threshold. Reds if any silence bar is hardcoded (e.g. the old 0.50) or otherwise does not track the threshold it protects (issue #1465, CL-20260714-4c23 / #1184)."
    detector: tests/unit/test_quality_gate_silence_bar.py
    own_tests:
      - tests/unit/test_quality_gate_silence_bar.py::test_silence_cliff_is_the_deployment_threshold_not_hardcoded_050
      - tests/unit/test_quality_gate_silence_bar.py::test_silence_bar_tracks_the_deployment_threshold

  - gate_id: sdk-silence-subgrade-multi-probe-median
    contract: "The training quality gate's silence subgrade MUST be measured from _NEAR_SILENCE_PROBE_COUNT (>=3, odd) independent near-silence realizations, aggregated by MEDIAN via _aggregate_silence_probe_scores, never the max window score of a single fixed clip. #1465 fixed the cliff's BAR; a single-clip max left the STATISTIC one-shot -- an idiosyncratic peak response to one specific noise realization forced grade F identically to a model systematically prone to firing on quiet backgrounds (Viola issue #1775, the ~19%-of-all-jobs chronic quality-gate failure; historical grade-F reads, CL-20260714-4c23 n=20, already showed the same wake word passing on one retrain and failing the next from exactly this kind of single-sample variance). Reds if the probe count collapses back to 1, or the aggregate becomes max()/mean() instead of the median, or a single outlier probe alone can push the aggregate at/above threshold."
    detector: tests/unit/test_quality_gate_silence_probe_robustness.py
    own_tests:
      - tests/unit/test_quality_gate_silence_probe_robustness.py::test_probe_count_is_more_than_one
      - tests/unit/test_quality_gate_silence_probe_robustness.py::test_seed_42_is_still_the_first_probe
      - tests/unit/test_quality_gate_silence_probe_robustness.py::test_single_idiosyncratic_spike_does_not_force_the_aggregate_above_threshold
      - tests/unit/test_quality_gate_silence_probe_robustness.py::test_systematically_risky_model_still_fails
      - tests/unit/test_quality_gate_silence_probe_robustness.py::test_aggregate_is_the_median_not_the_max_or_mean
      - tests/unit/test_quality_gate_silence_probe_robustness.py::test_empty_probe_list_keeps_the_conservative_safety_floor

  - gate_id: quality-gate-tts-outage-is-not-a-model-verdict
    contract: "The training quality gate MUST NOT return a grade when it could not synthesize enough of its OWN negative test material. It falls back per-sample to Kokoro when edge-tts fails (the #1768 fix, which the gate's own synthesis sites originally missed), and raises QualityGateUnavailableError -- NOT ModelQualityGateError -- when fewer than _MIN_QUALITY_GATE_COVERAGE of the requested speech phrases or confusable words were produced. Proven pre-fix by executing the real _run_quality_gate (Viola issue #1775) - a model outputting 0.0 on every window, incapable of false-firing at any threshold, graded A with TTS healthy and F with TTS dead, because _fp_rate returns 1.0 over ZERO scored samples, so a Microsoft-side voice retirement (CL-20260717-b117) or any network failure was published to the customer as \"your model would trigger on the wrong sound\". Reds if the coverage floor is removed or weakened to a bare zero-check, if the gate grades on an empty negative set, if the coverage floor is moved back onto synthesized FILES instead of SCORED SAMPLES (the wavs can exist while _extract_temporal_embeddings silently swallows per-file embedding failures and yields nothing, reaching the same 1.0 fp-rate over zero samples), if the Kokoro fallback is dropped from the gate's synthesis loops, if the outage error becomes a subclass of ModelQualityGateError (which is classified EXPECTED and deliberately does not page), or if an axis with ZERO requested samples falls through to be scored (generate_confusables is built on [a-z]+, so a purely numeric or symbolic wake word like '1234' - which recordings.py's sanitizer permits - yields no confusables at all, and _fp_rate's 1.0-over-empty then makes grade F guaranteed and unfixable by any retrain). This gate asserts the axes are MEASURED; it deliberately does NOT assert that a never-firing model passes, because the gate has no recall term and a future recall bar must be free to fail such a model."
    detector: tests/unit/test_quality_gate_tts_outage.py
    own_tests:
      - tests/unit/test_quality_gate_tts_outage.py::test_tts_outage_raises_instead_of_grading_the_model_f
      - tests/unit/test_quality_gate_tts_outage.py::test_healthy_tts_actually_measures_the_false_positive_axes
      - tests/unit/test_quality_gate_tts_outage.py::test_an_unmeasurable_axis_is_not_silently_scored_as_maximally_bad
      - tests/unit/test_quality_gate_tts_outage.py::test_the_two_unmeasurable_causes_give_different_advice
      - tests/unit/test_quality_gate_tts_outage.py::test_the_outage_error_is_not_a_model_quality_verdict
      - tests/unit/test_quality_gate_tts_outage.py::test_coverage_floor_rejects_an_empty_negative_set
      - tests/unit/test_quality_gate_tts_outage.py::test_coverage_floor_rejects_a_severely_undersized_negative_set
      - tests/unit/test_quality_gate_tts_outage.py::test_coverage_floor_accepts_a_full_or_adequately_covered_set
      - tests/unit/test_quality_gate_tts_outage.py::test_coverage_floor_is_a_real_fraction_not_just_a_zero_check
      - tests/unit/test_quality_gate_tts_outage.py::test_quality_gate_uses_the_kokoro_fallback_when_edge_tts_fails
      - tests/unit/test_quality_gate_tts_outage.py::test_unscorable_negatives_also_raise_even_though_the_wavs_exist

  - gate_id: quality-gate-failure-is-not-a-circuit-breaker-fault
    contract: "A ModelQualityGateError (grade-F verdict) MUST NOT count toward a user's training circuit breaker. JobQueue._execute_job's blanket except-Exception handler must consult _is_expected_training_outcome before calling _record_failure, matched by class name across the MRO so the backend never imports the heavy violawake_sdk. Pre-fix this was a compounding user-facing trap (Viola issue #1775) - the gate's own message tells the customer \"training varies run to run, so the quickest fix is to train again with the same recordings\", and FAILURE_THRESHOLD=3 consecutive failures then paused their queue with next_attempt_at=None, stranding every pending job until a manual resume_user (CL-20260717-9bc3), so the product instructed users straight into an account-level lockout. Reds if the guard is removed from the helper OR from the _execute_job call site, if the matcher stops traversing the MRO, if a genuine systemic fault stops tripping the breaker, or if QualityGateUnavailableError (our own TTS outage, which SHOULD trip it) is wrongly classified as expected."
    detector: console/tests/test_quality_gate_not_a_breaker_fault.py
    own_tests:
      - console/tests/test_quality_gate_not_a_breaker_fault.py::test_quality_gate_failure_does_not_count_as_a_breaker_fault
      - console/tests/test_quality_gate_not_a_breaker_fault.py::test_a_real_systemic_failure_still_trips_the_breaker
      - console/tests/test_quality_gate_not_a_breaker_fault.py::test_the_matcher_is_by_class_name_across_the_mro
      - console/tests/test_quality_gate_not_a_breaker_fault.py::test_the_guard_is_actually_wired_into_the_job_failure_handler
      - console/tests/test_quality_gate_not_a_breaker_fault.py::test_a_tts_outage_is_not_treated_as_an_expected_outcome

  - gate_id: training-extra-ships-the-tts-fallback
    contract: "The `training` extra MUST contain every package the training pipeline's TTS fallback needs, because the backend image installs `/sdk[training]` (console/Dockerfile.backend). _KokoroFallback is what stops one edge-tts voice retired server-side by Microsoft (CL-20260717-b117) from emptying a sample set, and for the quality gate an empty negative set is grade F by construction (#1775). kokoro-onnx sat only in the `tts` extra, so ready() returned False in production and the whole fallback -- including the #1768 fix -- was dead code exactly where it mattered, silently, because ready() fails gracefully by design and nothing goes red. Same missing-from-the-extra class as onnxscript and fast_mp3_augment. Reds if kokoro-onnx or edge-tts leaves the training extra, or if the backend image stops installing that extra without this gate being re-pointed."
    detector: tests/unit/test_training_extra_has_tts_fallback.py
    own_tests:
      - tests/unit/test_training_extra_has_tts_fallback.py::test_training_extra_includes_kokoro_so_the_fallback_is_not_inert
      - tests/unit/test_training_extra_has_tts_fallback.py::test_the_training_pipeline_actually_uses_the_kokoro_fallback
      - tests/unit/test_training_extra_has_tts_fallback.py::test_training_extra_also_still_includes_edge_tts
      - tests/unit/test_training_extra_has_tts_fallback.py::test_the_backend_image_installs_the_training_extra

  - gate_id: gate-contracts-are-not-silently-truncated
    contract: "No gate contract in quality/gates.yaml may be silently truncated. Contracts are written as YAML scalars and routinely cite issues (#1768, #1775); in an UNQUOTED plain scalar a space followed by # starts a comment, so YAML discards the rest at parse time with no error and no warning. This silently destroyed 7 of 34 contracts, losing 25-85% of their text each, including both gates protecting the #1775 silence subgrade. The gates still RAN (own_tests are separate list items) so nothing was red; what was lost is the human-readable statement of what each gate protects -- exactly what an engineer reads before deciding whether they may change a guarded behaviour. Reds if any contract parses shorter than the text actually on its line."
    detector: tests/unit/test_gates_registry_not_truncated.py
    own_tests:
      - tests/unit/test_gates_registry_not_truncated.py::test_no_gate_contract_is_silently_truncated
      - tests/unit/test_gates_registry_not_truncated.py::test_the_registry_still_parses
      - tests/unit/test_gates_registry_not_truncated.py::test_a_contract_containing_an_issue_reference_survives_parsing
      - tests/unit/test_gates_registry_not_truncated.py::test_the_1775_gates_carry_their_full_contract

  - gate_id: training-queue-wedge-detection
    contract: "The /api/health training_queue check reports ERROR (pageable) only on a genuine dispatcher wedge -- a dead/overloaded worker, or a dispatchable pending job aged past training_queue_wedge_threshold_seconds while a worker slot is free -- and stays OK on ordinary backlog and on pending jobs blocked only by a paused/backoff circuit breaker. Catches the 2026-07-14 issue #1481 class where any queue_depth>0 marked the backend degraded/503, so one paused-breaker job (job 85) pinned it unhealthy for hours while a real wedge produced the same indistinct signal."
    detector: console/tests/test_training_queue_wedge.py
    own_tests:
      - console/tests/test_training_queue_wedge.py::test_paused_breaker_pending_is_blocked_not_dispatchable
      - console/tests/test_training_queue_wedge.py::test_health_paused_blocked_only_is_ok
      - console/tests/test_training_queue_wedge.py::test_health_genuine_dispatch_wedge_is_error
      - console/tests/test_training_queue_wedge.py::test_health_normal_backlog_all_slots_busy_is_ok
  - gate_id: edge-tts-synthesis-resilience
    contract: "EDGE_TTS_VOICES must never carry a voice Microsoft has retired server-side (GlitchTip 34/38, ticket 1768 -- en-US-DavisNeural + 6 others silently failed every attempt, forever); a distinct (voice, text) edge-tts failure must be reported on its own instead of being deduped away by an earlier, unrelated failure sharing the same generic exception text; that dedup state must reset per training job so one job's failure never silently suppresses a different job's identical failure; and the Kokoro TTS fallback must apply per-sample, never sticking to Kokoro-only for an entire run's remaining (and otherwise-healthy) voices just because one earlier voice failed."
    detector: tests/unit/test_train.py
    own_tests:
      - tests/unit/test_train.py::TestTrainHelpers::test_edge_tts_voices_excludes_known_retired_voices
      - tests/unit/test_train.py::TestTrainHelpers::test_edge_tts_fail_reports_each_distinct_voice_independently
      - tests/unit/test_train.py::TestTrainHelpers::test_edge_tts_fail_still_dedups_same_voice_repeat
      - tests/unit/test_train.py::TestTrainHelpers::test_reset_edge_tts_reporting_clears_cross_job_dedup_state
      - tests/unit/test_train.py::TestTrainHelpers::test_generate_tts_positives_falls_back_per_voice_not_sticky
      - tests/unit/test_train.py::TestTrainHelpers::test_generate_confusable_negatives_falls_back_to_kokoro
      - console/backend/tests/test_train_full_pipeline_voices.py::TestTrainFullPipelineVoices::test_edge_voices_excludes_known_retired_voices
      - console/backend/tests/test_train_full_pipeline_voices.py::TestTrainFullPipelineVoices::test_edge_voices_has_no_duplicates

  - gate_id: quality-gate-block-dashboard-signal

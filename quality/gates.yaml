  - gate_id: service-tenant-partitions-per-user-controls
    contract: Work arriving under the shared service-key account must be partitioned by the tenant key its caller presents, so the training circuit breaker, the PER_USER_MAX_PENDING cap, the failure-backoff timer, the per-user rate-limit buckets (TRAINING_SUBMIT_LIMIT, RECORDING_UPLOAD_LIMIT) and job ownership each apply to ONE upstream user instead of that caller's whole install base; a service-key request naming no usable tenant is refused rather than folded into the shared partition, and upgrading a pre-tenant database moves nobody (an account keeps its pause verbatim under the empty tenant key). Proven against master 06b35f8 with the real shared service account (prod user 47): all three isolation properties failed.

    contract: The built sdist must contain no secret-shaped content (Stripe sk_live/whsec, Postgres URL creds, Cloudflare tunnel token, private keys, cloud API keys) and no credential/agent-debris file names (.codex*, .env* except *.example, secrets.json, *.pem). Catches the 2026-05-08 violawake 0.2.4 leak class where unignored codex transcripts shipped a live Stripe key.
    detector: tests/unit/test_sdist_hygiene.py
    own_tests:
      - tests/unit/test_sdist_hygiene.py::test_release_sdist_contains_no_secrets_or_debris
      - tests/unit/test_sdist_hygiene.py::test_scanner_flags_codex_log_debris_by_name
      - tests/unit/test_sdist_hygiene.py::test_scanner_flags_live_stripe_key_in_innocuous_file
      - tests/unit/test_sdist_hygiene.py::test_scanner_flags_env_backup_and_postgres_and_tunnel
      - tests/unit/test_sdist_hygiene.py::test_scanner_stays_quiet_on_clean_tree

  - gate_id: console-quality-gate-block-is-expected-not-bug
    contract: A grade-F model quality-gate block (ONNX export blocked for weak/insufficient user recordings) is an EXPECTED training outcome and must be classified expected/WARNING (below the Sentry LoggingIntegration ERROR event_level), never an unexpected "bug"/ERROR that pages ops via GlitchTip (violawake issue 28, 2026-07-12). Classification keys off the ModelQualityGateError type, never the message text.
    detector: console/backend/tests/test_monitoring_quality_gate_classification.py
    own_tests:
      - console/backend/tests/test_monitoring_quality_gate_classification.py::test_quality_gate_error_is_expected_and_below_sentry_level
      - console/backend/tests/test_monitoring_quality_gate_classification.py::test_bare_runtimeerror_grade_f_message_is_still_the_old_bug_shape

  - gate_id: sdk-silence-subgrade-derived-from-deploy-threshold
    contract: The training quality gate's silence subgrade MUST be a false-fire RATE measured on REAL-LEVEL no-wake audio through the RUNTIME streaming path, over INDEPENDENT samples, and MUST fail closed when it cannot be measured. No silence bar may be a hardcoded score constant. Concretely: _grade_quality takes silence_fp_rate (never a silence_max_score compared against a score bar) and grades it on the same rate tiers as the speech subgrade; the probe is real recorded room tone with the spoken wake word excluded, and any fallback probe sits inside the measured real room-tone band int16 RMS 224-3782 (never synthetic white noise at int16 RMS ~3, which the 2026-07-29 amplitude sweep showed is the MAXIMUM of the streaming false-fire curve, so the retired probe graded every model near its worst point); it is scored via _extract_streaming_temporal_windows over the FULL clip, never the batch 1.5s center-crop that produced exactly one window; the rate is taken over NON-OVERLAPPING windows via _decimate_to_independent_windows, never over the raw stride-1 stream whose adjacent windows share seq_len-1 of seq_len frames (~89% identical at the production seq_len of 9); and a silence_fp_rate of None grades F, because an axis nobody scored is not an axis that passed -- with an under-powered user sample first falling back to _synthetic_room_tone so no customer is ever failed for how they trimmed their recordings. Reds on the pre-fix shapes -- the hardcoded 0.50 cliff (#1465, CL-20260714-4c23 / #1184); the single-max-draw synthetic-probe subgrade that survived it and still failed 12 of 21 post-fix production jobs on this axis alone (#2611 / #1487 / #2066, box evidence 2026-07-24); and this gate's own first draft, which rated the self-overlapping stream and graded an unmeasured axis A (Viola#1487 comment 5121584192).
    detector: tests/unit/test_quality_gate_silence_bar.py
    own_tests:
      - tests/unit/test_quality_gate_silence_bar.py::test_silence_subgrade_is_a_rate_not_a_single_max_score
      - tests/unit/test_quality_gate_silence_bar.py::test_silence_rate_tiers_match_the_speech_subgrade
      - tests/unit/test_quality_gate_silence_bar.py::test_an_unmeasured_silence_axis_fails_closed
      - tests/unit/test_quality_gate_silence_bar.py::test_no_silence_score_bar_is_hardcoded
      - tests/unit/test_quality_gate_silence_probe.py::test_room_tone_is_extracted_at_a_physically_real_level
      - tests/unit/test_quality_gate_silence_probe.py::test_room_tone_excludes_the_spoken_wake_word
      - tests/unit/test_quality_gate_silence_probe.py::test_silence_subgrade_uses_the_streaming_extractor_not_the_batch_crop
      - tests/unit/test_quality_gate_silence_probe.py::test_streaming_extractor_windows_the_whole_clip
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_an_unscored_silence_axis_cannot_grade_as_clean
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_the_quality_gate_falls_back_to_a_probe_rather_than_failing_the_user
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_the_fallback_probe_sits_at_a_real_room_tone_level
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_short_room_tone_yields_are_pooled_across_recordings
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_overlapping_windows_are_decimated_to_independent_samples
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_decimation_is_per_clip_so_clips_do_not_absorb_each_other
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_the_denominator_becomes_the_real_sample_size_without_moving_the_estimate
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_decimation_does_not_re_calibrate_the_grade_bars
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_the_gate_rates_the_decimated_scores_not_the_raw_stream
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_an_underpowered_sample_is_not_reported_as_a_rate
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_decimation_cannot_preserve_a_max_only_a_rate
      - tests/unit/test_silence_subgrade_measurement_integrity.py::test_the_reported_silence_max_is_the_worst_streamed_window

  - gate_id: training-queue-wedge-detection
    contract: The /api/health training_queue check reports ERROR (pageable) only on a genuine dispatcher wedge -- a dead/overloaded worker, or a dispatchable pending job aged past training_queue_wedge_threshold_seconds while a worker slot is free -- and stays OK on ordinary backlog and on pending jobs blocked only by a paused/backoff circuit breaker. Catches the 2026-07-14 issue #1481 class where any queue_depth>0 marked the backend degraded/503, so one paused-breaker job (job 85) pinned it unhealthy for hours while a real wedge produced the same indistinct signal.
    detector: console/tests/test_training_queue_wedge.py
    own_tests:
      - console/tests/test_training_queue_wedge.py::test_paused_breaker_pending_is_blocked_not_dispatchable
      - console/tests/test_training_queue_wedge.py::test_health_paused_blocked_only_is_ok
      - console/tests/test_training_queue_wedge.py::test_health_genuine_dispatch_wedge_is_error
      - console/tests/test_training_queue_wedge.py::test_health_normal_backlog_all_slots_busy_is_ok
  - gate_id: infra-fault-refunds-training-attempt
    contract: A training job that dies on OUR infrastructure (a SharedInfrastructureUnavailableError shared-corpus/TTS outage, or a job that can never dispatch because the account is already paused) must not spend one of a customer's monthly training attempts, and a failure must be communicated. Concretely (violawake issue 4207, four hard-paused uncontacted accounts 122/130/138/150, quota reset 2026-08-01) submit_training_job charges at submit via record_usage, so a paused account's submit is REFUSED with 409 BEFORE record_usage fires; an infra-fault failure in _execute_job calls _refund_usage_for_job, which credits the attempt back exactly once (the job row's one-shot usage_refunded flag guards however many paths ask) and against the period the charge was made in (mark_usage_charged stamps usage_period_start; refund_usage decrements that period with a count greater than zero clamp, so a 07-31 submit failing 08-01 credits July and can never mint a bonus August attempt); a genuine per-user failure still keeps its charge and still trips the breaker (the guard is narrow, not an amnesty); and every failure sends send_training_failed (the console had send_training_complete and no counterpart), with charged False on an infra fault so the copy never implies a lost attempt. Reds on the pre-fix shape -- charge-at-submit with no refund seam, no paused-submit guard, and no failure email.
    detector: console/tests/test_infra_fault_does_not_charge_attempt.py
    own_tests:
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_infra_fault_refunds_the_charged_attempt
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_refund_is_idempotent_and_spares_the_legit_attempt
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_a_genuine_failure_keeps_its_charge_and_trips_the_breaker
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_paused_submit_is_refused_before_any_charge
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_a_failure_emails_the_customer
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_infra_fault_email_says_the_attempt_was_not_charged
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_a_pause_is_visible_and_clearable
  - gate_id: stranded-pending-job-abandoned-on-pause
    contract: A training job already charged and PENDING at the instant its partition's circuit breaker pauses must not strand as Queued forever with the attempt spent (violawake issue 4207 follow-on, Viola issue 4435). PR 36 refused a NEW submit to an already-paused partition but left three ways an EXISTING pending job could still strand. First, _record_failure flips paused to True while a sibling job is already PENDING and charged, and _fill_queue_from_db skips every paused partition's rows on every fill forever, so that sibling never dispatches. Second, _execute_job's own paused check returned early without touching job status, the narrower race where a job already reached the in-memory dispatch queue before the pause landed. Third, a restart or deploy finds a strand that predates this fix with nothing to reconcile it. All three now route through _abandon_stranded_pending_jobs or _abandon_stranded_job, which credit the charge back via _refund_usage_for_job (now returns a bool instead of assuming success) and end the job as FAILED with a clear reason, scoped strictly to the paused partition so a different tenant's own pending job survives untouched. The boot-time sweep (the third case) is silent by design, no email, since contacting an already-affected customer is Viola issue 2066's founder-gated call, not something a container restart should trigger on its own. Reds on the pre-fix shape, where a stranded sibling stays PENDING forever with its charge intact and usage_after never drops.
    detector: console/tests/test_infra_fault_does_not_charge_attempt.py
    own_tests:
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_a_sibling_pending_job_is_abandoned_and_refunded_when_its_partition_pauses
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_a_job_that_reaches_execute_job_already_paused_is_abandoned_not_silently_skipped
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_boot_reconciles_a_preexisting_stranded_job_without_emailing
      - console/tests/test_infra_fault_does_not_charge_attempt.py::test_abandon_sweep_does_not_touch_a_different_partitions_pending_job
  - gate_id: recordings-outlive-every-job-that-needs-them
    contract: A recording referenced by a PENDING or RUNNING training job must not be deleted, soft or hard, by any retention path, and a job whose inputs vanish anyway must not spend a training attempt or a circuit-breaker strike (Viola issue 4617, GlitchTip violawake issue 109). Live root cause, read off the prod queue DB and prod Postgres rather than inferred - jobs 147 and 148 were the same user, the same wake word and the SAME ten recording ids submitted 765ms apart, a duplicate submit that validate_training_request accepted and charged twice because all ten recordings genuinely existed at submit; job 147 completed at 11:54:16.711511, retention.mark_recordings_for_deletion soft-deleted all ten 14ms later, and job 148 dispatched 252ms after that to find zero, failing with the misleading RuntimeError No valid recordings found and usage_refunded 0. mark_recordings_for_deletion was the only deletion path in the module lacking the _get_active_recording_ids guard that cleanup_soft_deleted_recordings and cleanup_expired_recordings both already had, and it is the one that needs it most, since it fires milliseconds after a completion instead of hours later on an age cutoff. The guard is now applied there, with the active set computed by JobQueue._active_recording_ids from the queue's own connection rather than resolved through the process-wide singleton, because that singleton returns an empty set (meaning nothing is protected) whenever it is not initialised, which is a silent fail-open of exactly the shape being fixed. Retention is deferred, never disabled - the last job holding a reference still deletes on completion. Separately, a job whose recordings are missing at dispatch now raises RecordingsUnavailableError, a subclass of SharedInfrastructureUnavailableError so the no-strike and refund classification is inherited structurally with no second registry to drift, and it reports the real counts (4 of 10) instead of claiming none were valid. Reds on the pre-fix shape, where completing one job deletes a queued sibling's recordings and the resulting failure is charged and struck.
    detector: console/tests/test_recordings_survive_until_their_job_runs.py
    own_tests:
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_a_sibling_job_still_has_its_recordings_after_its_twin_completes
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_deferred_recordings_are_deleted_when_the_last_job_finishes
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_retention_still_fires_when_no_other_job_holds_the_recordings
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_a_different_users_pending_job_does_not_defer_our_deletion
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_a_job_whose_recordings_vanished_is_not_charged_and_not_struck
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_the_failure_message_reports_the_real_counts
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_the_vanished_inputs_error_inherits_the_no_strike_classification
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_a_genuine_training_failure_is_still_charged_and_still_struck
      - console/tests/test_recordings_survive_until_their_job_runs.py::test_submit_and_dispatch_share_one_floor

  - gate_id: edge-tts-synthesis-resilience
    contract: "EDGE_TTS_VOICES must never carry a voice Microsoft has retired server-side (GlitchTip 34/38, ticket 1768 -- en-US-DavisNeural + 6 others silently failed every attempt, forever); a distinct (voice, text) edge-tts failure must be reported on its own instead of being deduped away by an earlier, unrelated failure sharing the same generic exception text; that dedup state must reset per training job so one job's failure never silently suppresses a different job's identical failure; and the Kokoro TTS fallback must apply per-sample, never sticking to Kokoro-only for an entire run's remaining (and otherwise-healthy) voices just because one earlier voice failed."
    detector: tests/unit/test_train.py

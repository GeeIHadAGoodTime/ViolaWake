      - console/tests/test_shared_outage_is_not_a_customer_strike.py::test_back_pressure_is_still_applied
      - console/tests/test_shared_outage_is_not_a_customer_strike.py::test_a_genuine_per_user_fault_still_trips_the_breaker
      - console/tests/test_shared_outage_is_not_a_customer_strike.py::test_an_existing_lockout_is_not_silently_cleared
      - console/tests/test_shared_outage_is_not_a_customer_strike.py::test_the_matcher_is_by_class_name_across_the_mro

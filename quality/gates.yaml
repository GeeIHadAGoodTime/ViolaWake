  - gate_id: service-tenant-partitions-per-user-controls
    contract: Work arriving under the shared service-key account must be partitioned by the tenant key its caller presents, so the training circuit breaker, the PER_USER_MAX_PENDING cap, the failure-backoff timer, the per-user rate-limit buckets (TRAINING_SUBMIT_LIMIT, RECORDING_UPLOAD_LIMIT) and job ownership each apply to ONE upstream user instead of that caller's whole install base; a service-key request naming no usable tenant is refused rather than folded into the shared partition, and upgrading a pre-tenant database moves nobody (an account keeps its pause verbatim under the empty tenant key). Everything that READS that partitioning must key on the same pair the dispatcher does - the health snapshot joins breakers on (user_id, tenant_key), so one pending job is counted once rather than once per breaker row of its account, and a job stranded behind its own tenant's pause is never reported dispatchable (which would false-page the queue as wedged past the wedge threshold). Recognition of the service account must not fail open either: minting it and recognising it resolve the same default address, so a blank VIOLAWAKE_SERVICE_USER_EMAIL cannot make the account unrecognisable and silently fold every upstream user back into one shared partition with no 400. Proven against master 06b35f8 with the real shared service account (prod user 47): all three isolation properties failed. The read-side additions were proven against master fdf456d, where the live production snapshot reported queue_depth 3 for one pending job on an account holding three breaker rows and called that stranded job dispatchable.
